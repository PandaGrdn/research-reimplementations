# CPU CI overlay. run_all.py --smoke must finish in <10 min.
n_seeds: 1
n_seeds_inference: 1

data:
  n_train: 2
  n_val: 1
  n_test: 1

spatial:
  epochs: 1
  num_epochs_inner: 2
  n_frames: 8

inference:
  num_epochs_inner: 2
  lr_r: 0.02

temporal:
  epochs: 1
  r_noise_std_end: 0.0
  ss_p_end: 0.0
  rollout_k: 1

amortized:
  epochs: 1
  batch_size: 4
  hidden: 8

eval:
  n_rollout_sequences: 1
  n_pair_sequences: 1
  n_unrelated_frames: 4
  max_unrelated_pairs: 6
  n_determinism_frames: 2
  split_points: [2]
  headline_split: 2

c2:
  cells: ["baseline", "all_combined", "temporal_prior_off"]

c4:
  iters: [2]
  lr_r: [0.02]
  init_noise: [0.0, 0.01]
  use_prior: [true]

c5:
  iters: [2]

c7:
  lambda_slow: [0.0, 1.0]
  unroll_k: [0, 2]

ladder:
  arms: [baseline, zero_init]
  only: [c1, c5, c9]

c8:
  arms: ["iterative", "amortized"]

c0:
  max_iters: 2

c9:
  n_train_sequences: 1
  steps: 5
  models: ["linear"]
  shifts: [[2, 0], [1, 0]]
  n_translation_frames: 2

c10:
  n_sequences: 1

c11:
  epochs: 2
  n_train_sequences: 2
  n_test_sequences: 1
  probe_epochs: 1

c12:
  n_sequences: 1
  n_control_frames: 2
  fade_scales: [1.0, 0.5, 0.0]
  settle_iters: 2

c13:
  n_sequences: 1
  iters: 2
  arms: ["none", "consistency_top_down", "image_settle", "oracle_image"]
  fallback_epochs: 1
